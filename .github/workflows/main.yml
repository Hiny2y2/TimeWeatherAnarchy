
name: Package TimeWeatherAnarchy

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TimeWeatherAnarchy/UI/package-lock.json

      - name: Build UI
        working-directory: TimeWeatherAnarchy/UI
        run: |
          npm ci
          npm run build

      - name: Upload project package
        uses: actions/upload-artifact@v4
        with:
          name: TimeWeatherAnarchy-project
          path: |
            TimeWeatherAnarchy/
          if-no-files-found: error
